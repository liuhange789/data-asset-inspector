# Cordis Framework Patch Declaration for @liuhange/dsh-visibility-doctor
- target: loaders.web
  action: insert
  entry:
    id: "@liuhange/dsh-visibility-doctor"
    name: "@liuhange/dsh-visibility-doctor"
    version: "1.0.5"
- target: loaders.headless
  action: insert
  entry:
    id: "@liuhange/dsh-visibility-doctor"
    name: "@liuhange/dsh-visibility-doctor"
    version: "1.0.5"
- target: tools
  action: register
  description: Register visibility doctor tools into Cordis runtime
  plugin: "@liuhange/dsh-visibility-doctor"
  version: "1.0.5"
